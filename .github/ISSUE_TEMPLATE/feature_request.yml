name: 功能建议 / Feature Request
description: 提出新功能、读包格式扩展或使用体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 [ROADMAP.md](https://github.com/SFology/dsh-paper-reader/blob/main/ROADMAP.md)，避免重复现有计划。
        功能建议不必等技术方案，先说清楚「你在什么场景下遇到了什么麻烦」。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接给实现方案。
      placeholder: 例如：读一篇 60 页的论文时，目录太长，想按标签快速跳到「易错」单元。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它长什么样、怎么交互？有草图或参考产品更好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在你用什么办法绕过这个问题？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 前端渲染 / 门禁 / 批注
        - AI 面板 / 本地网关
        - 读包格式 / 校验器 / 构建器
        - 导入器
        - DSH 插件
        - 文档 / 工具链
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 你愿意参与实现吗？
      options:
        - label: 愿意提交 PR
        - label: 愿意提供读包内容或测试用例
        - label: 暂时只能提建议
